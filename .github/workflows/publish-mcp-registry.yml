name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# This does NOT publish the npm package — that happens separately (see
# docs/mcp-registry.md). The npm package must already be published at the
# version referenced in server.json before this workflow can succeed, because
# the registry verifies package ownership by reading `mcpName` from the
# published npm manifest.
#
# Trigger: manual dispatch, or automatically when a GitHub Release is
# published (this repo tags releases after the npm package is already live).
on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  # Build the one-click MCP Bundle and attach it to the GitHub Release.
  #
  # Independent of the registry publish below: this packs from the checked-out
  # source, so it does not wait on npm propagation, and a bundle failure must
  # not stop the registry from being updated.
  bundle:
    name: Build and attach the .mcpb bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .mcpb as a release asset

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync manifest.json version to the released package version
        if: github.event_name == 'release'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      # Production dependencies only. `mcpb pack` does NOT prune devDependencies
      # — packing after a plain `npm ci` ships jest, c8 and the MCP client SDK
      # and adds ~6 MB. Playwright's browser binaries install outside
      # node_modules and are deliberately not bundled.
      - name: Install production dependencies
        run: npm ci --omit=dev
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Pack the bundle
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "crawlforge-mcp-server-${VERSION}.mcpb"
          ls -lh "crawlforge-mcp-server-${VERSION}.mcpb"
          echo "MCPB_FILE=crawlforge-mcp-server-${VERSION}.mcpb" >> "$GITHUB_ENV"

      # Proves the packed bundle actually starts and speaks MCP before it is
      # published. A bad .mcpbignore pattern (an unanchored `cache/` matches
      # src/core/cache/) produces a bundle that packs cleanly and then fails at
      # startup with ERR_MODULE_NOT_FOUND.
      - name: Smoke-test the packed bundle
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 unpack "$MCPB_FILE" /tmp/mcpb-check
          cd /tmp/mcpb-check
          RESPONSE=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 60 node server.js 2>/tmp/mcpb-smoke.err | head -c 400 || true)
          echo "$RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"protocolVersion"'; then
            echo "::error::The packed bundle did not complete an MCP initialize handshake."
            head -20 /tmp/mcpb-smoke.err
            exit 1
          fi
        env:
          CRAWLFORGE_API_KEY: bundle-smoke-test
          CRAWLFORGE_SKIP_STARTUP_VALIDATION: 'true'

      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        run: gh release upload "${GITHUB_REF#refs/tags/}" "$MCPB_FILE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: ${{ env.MCPB_FILE }}

  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication to the MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync server.json version to the released package version
        if: github.event_name == 'release'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      # `mcp-publisher publish` exiting 0 only means the registry accepted the
      # request. Read the version back before calling the release done.
      #
      # The registry keeps EVERY published version as its own record under the
      # same name (23 of them by 5.5.2), newest not guaranteed last, so the only
      # correct read is: filter to our exact name, then take the record flagged
      # isLatest. Taking .servers[0] returns a years-old version and reads as a
      # failed publish.
      - name: Verify the registry serves the version we just published
        run: |
          EXPECTED=$(jq -r '.version' server.json)
          NAME=$(jq -r '.name' server.json)
          SEARCH=$(jq -r '.packages[0].identifier' server.json)

          for attempt in $(seq 1 10); do
            LATEST=$(curl -sSf "https://registry.modelcontextprotocol.io/v0/servers?search=${SEARCH}&limit=100" \
              | jq -r --arg n "$NAME" '
                  [ .servers[]
                    | select(.server.name == $n)
                    | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true)
                    | .server.version ]
                  | first // ""
                ')

            if [ "$LATEST" = "$EXPECTED" ]; then
              echo "MCP Registry serves $NAME $LATEST (isLatest)."
              exit 0
            fi

            echo "attempt $attempt: registry isLatest is '${LATEST:-<none>}', want '$EXPECTED' — retrying in 10s"
            sleep 10
          done

          echo "::error::MCP Registry did not serve $EXPECTED as isLatest after 10 attempts (last saw '${LATEST:-<none>}')."
          exit 1
