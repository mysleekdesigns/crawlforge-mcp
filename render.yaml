# Render blueprint for CrawlForge MCP Server.
# Connect this repo to Render and the dashboard will offer to deploy this file
# (https://render.com/docs/blueprint-spec). All values here can be overridden in
# the dashboard per-service.
services:
  - type: web
    name: crawlforge-mcp
    runtime: docker
    plan: standard           # 2 GB RAM. Kept in sync with the dashboard so a
                             # blueprint re-apply can't downgrade the box.
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render injects PORT=10000 by default. server.js / Dockerfile already
    # default to 10000, so explicit listening on $PORT works without changes.
    # The HTTP transport binds 0.0.0.0 here automatically because Render sets
    # RENDER=true (it defaults to loopback 127.0.0.1 everywhere else, so a local
    # `--http` is not LAN-exposed). Set MCP_HTTP_HOST to override the bind.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_HTTP
        value: "true"
      # Stage-2 SSRF enforcement: block RFC1918 / ULA / CGNAT / loopback /
      # link-local, not just the metadata + loopback range Stage-1 covers. This
      # hosted box only ever reaches public scrape targets and the public
      # website, so full private-range blocking closes the internal-network
      # reach a rendered/stealth navigation could otherwise be steered toward.
      # Left off by default for npm/local users so they can scrape their own
      # localhost; on by name here.
      - key: SSRF_STRICT
        value: "true"
      # Cap live browser contexts per manager. The default is 10, but each
      # co-resident StealthBrowserManager (deep_research's, and extract/scrape's
      # BrowserProcessor) keeps its own pool AND its own Chromium, so the real
      # worst case is 2-3x this across multiple browser processes. 6 is
      # comfortable on the 2 GB standard box while bounding that blow-up; raise
      # or lower it with the plan size. (npm/local users keep the default 10.)
      - key: MAX_BROWSER_CONTEXTS
        value: "6"
      # CRAWLFORGE_API_KEY must be set in the dashboard (it's a secret).
      # Add it manually under "Environment" → "Add Environment Variable".
      - key: CRAWLFORGE_API_KEY
        sync: false
      # Shared secret for the crawlforge-website REST proxy (sent as the
      # X-Internal-Secret header; see src/server/requestContext.js). Must
      # match CRAWLFORGE_MCP_INTERNAL_SECRET on Vercel. Set in the dashboard.
      - key: INTERNAL_PROXY_SECRET
        sync: false
      # Optional: point the LLM tools (extract_with_llm, and the fallback
      # chain used by agent/summarize_content/track_changes) at any
      # Ollama-compatible endpoint. For Ollama Cloud: OLLAMA_BASE_URL =
      # https://ollama.com, OLLAMA_API_KEY = a key from
      # https://ollama.com/settings/keys, OLLAMA_DEFAULT_MODEL = a cloud
      # model name from https://ollama.com/search?c=cloud. Leave unset to
      # keep the localhost default (no Ollama on this box → tools report
      # an honest failure).
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_DEFAULT_MODEL
        sync: false
