# Render blueprint for CrawlForge MCP Server.
# Connect this repo to Render and the dashboard will offer to deploy this file
# (https://render.com/docs/blueprint-spec). All values here can be overridden in
# the dashboard per-service.
services:
  - type: web
    name: crawlforge-mcp
    runtime: docker
    plan: starter            # bump to standard/pro for production traffic
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render injects PORT=10000 by default. server.js / Dockerfile already
    # default to 10000, so explicit listening on $PORT works without changes.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_HTTP
        value: "true"
      # CRAWLFORGE_API_KEY must be set in the dashboard (it's a secret).
      # Add it manually under "Environment" → "Add Environment Variable".
      - key: CRAWLFORGE_API_KEY
        sync: false
      # Shared secret for the crawlforge-website REST proxy (sent as the
      # X-Internal-Secret header; see src/server/requestContext.js). Must
      # match CRAWLFORGE_MCP_INTERNAL_SECRET on Vercel. Set in the dashboard.
      - key: INTERNAL_PROXY_SECRET
        sync: false
      # Optional: point the LLM tools (extract_with_llm, and the fallback
      # chain used by agent/summarize_content/track_changes) at any
      # Ollama-compatible endpoint. For Ollama Cloud: OLLAMA_BASE_URL =
      # https://ollama.com, OLLAMA_API_KEY = a key from
      # https://ollama.com/settings/keys, OLLAMA_DEFAULT_MODEL = a cloud
      # model name from https://ollama.com/search?c=cloud. Leave unset to
      # keep the localhost default (no Ollama on this box → tools report
      # an honest failure).
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_DEFAULT_MODEL
        sync: false
