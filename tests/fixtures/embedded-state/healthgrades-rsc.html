<script>self.__next_f.push([1,"Telehealth only. Adults only. Come see us.\n  \nDr. Brown is thrilled to help you!\n  \nWe accept Medicare nationwide, Florida Blue, Anthem/Blue in many other states, Cigna/Aetna in WI, and many more options, as well as self-pay.\n  \nDr. Sherry-Ann Brown is a national and international expert in cardiology (including cardio-oncology), internal medicine, and clinical research, known as \"America's Expert Cardiologist.\" She is medically licensed nationwide and is available by video in your area. She also incorporates digital health and remote patient monitoring for optimal care and management.\n  \nDr. Brown entered the medical field to provide patients with tailored care and to show how lifestyle choices affect health. She is committed to finding the source of issues and inspiring her patients to take an active role in their healthcare. She listens carefully and has insightful conversations to learn more about each patient. Understanding that every patient's condition is unique, she modifies treatment programs accordingly. Dr. Brown consistently provides high-quality, thoughtful care that leads to beneficial and long-lasting health and heart outcomes. This is why patients trust her.\n  \nShe holds board certifications in Internal Medicine and Cardiology from the American Board of Internal Medicine and the American College of Cardiology. Dr. Brown earned her Doctor of Medicine from the University of Connecticut and completed her PhD at the University of Connecticut Health Center. She also holds a Bachelor's degree and a Master's in Biotechnology/Bioinformatics from Wesleyan University.\n\nDr. Brown is the Founder and President of My Heart Spark P.C., and the Founder and CEO of Preventive Cardio-Oncology LLC and My Heart Risk in Cancer. She serves as an Adjunct Assistant Professor at the Medical College of Wisconsin, with clinical research affiliations at the Cancer Center, Cardiovascular Center, and Clinical and Translational Research Institute."])</script>

<script>self.__next_f.push([1,"Dr. Alberto Interian Jr., born in Havana Cuba, obtained his Bachelor of Science degree from University of Miami. When he completed his residency, he entered the emerging field of Cardiac Electrophysiology. At the time, he was considered a pioneer in his field of expertise. Afterwards, he started heading the formal electrophysiology training program at University of Miami Jackson Memorial Hospital for several years. He started out as an Assistant Professor, then Associate Professor with Tenure, until he became a Full Professor with Tenure. He published extensively and was involved with many cutting edge technologies and studies. He soon became Associate Chief of Cardiology, then Interim Chief of Cardiology, and later went on to open the Arrhythmia and Syncope Center at HCA Florida Mercy Hospital where he has been the Medical Director since 2006. Dr. Alberto Interian, Jr. has three amazing children, his two boys, Allan and Albert, (which just like his father also graduated from University of Miami, and currently practices law). His youngest child, Sophia, is his pride and joy. Although he works tirelessly, he always finds a way to spend quality time and vacation frequently with the family. His spare time can range anywhere from visiting family, to enjoying the simplest pleasures, (such as working on electronics and speakers). Throughout the years he has bought the same philosophy into his own field. His staff and patients, to him, are his family, therefore he takes the best care of them possible. To Dr. Interian, service is number one. Nothing is more important than patient care!"])</script>

<script>self.__next_f.push([1,"Dr. Enrique Hernandez has been serving the great community of Miami since 2016 after serving as Associate Director of Peripherovascular Disease at the Cardiology Department of Lenox Hill Heart \u0026 Vascular Institute in New York.  There, Dr. Hernandez performed the first catheter-based repair of an abdominal aortic aneurysm using a completely non-surgical technique and was among the first in New York City to perform this procedure.  Thereafter, he practiced in Houston, Texas with the world-renowned medical group Leachman Cardiology Associates.Dr. Hernandez is considered a new breed of Interventional Cardiologist, having completed fellowship training in General Cardiology at St. Vincent's Medical Center in New York and Interventional Cardiology at one of the premier US programs in this field at Mount Sinai Medical Center in New York, where he developed expertise in complex coronary interventions via both radial and femoral approach (wrist \u0026 groin access respectively).  He then trained in the treatment of complex peripheral vascular disease and aortic aneurysm at the prestigious Vascular center the Texas Heart Institute in Houston, Texas with world renowned physicians in that field.   His interest and skills include, in addition to complex coronary interventions, the treatment of carotid artery disease, renal and lower extremity arterial disease, aortic aneurysms, and venous disease, which includes early intervention for deep venous thrombosis (DVT) as well as ablation of varicose veins and spider veins (therapeutic and cosmetic) and stenting of deep veins. Dr. Hernandez has been an investigator in numerous clinical trials of new therapies for coronary artery disease and peripheral vascular disease and has written several book chapters and articles on these topics."])</script>

<script>self.__next_f.push([1,"\u003cp style=\"font-weight: 400;\"\u003eA cardiologist specializes in caring for people with conditions and diseases of the heart and blood vessels. Cardiologists diagnose and treat many diseases, including coronary heart disease, angina, arrhythmias, heart attack, and heart failure. These heart doctors are also experts in the prevention of heart disease.\u003c/p\u003e\n\u003cp style=\"font-weight: 400;\"\u003eA cardiologist typically:\u003c/p\u003e\n\u003cul style=\"font-weight: 400;\"\u003e\n\u003cli\u003eEvaluates a patient\u0026rsquo;s medical history and educates the patient about heart health and heart disease prevention\u003c/li\u003e\n\u003cli\u003ePerforms a physical exam including evaluating blood pressure, vital signs, weight, and the health of the heart, lungs, and blood vessels\u003c/li\u003e\n\u003cli\u003eOrders and interprets laboratory and imaging tests and prescribes medications\u003c/li\u003e\n\u003cli\u003eDiagnoses and treats acute and chronic diseases and conditions that affect the heart and blood vessels including coronary heart disease, angina, arrhythmias, heart attack, and heart failure\u003c/li\u003e\n\u003cli\u003eScreens, treats, and monitors conditions known to increase the risk of heart disease, such as hypertension,\u0026nbsp;\u003ca href=\"https://www.healthgrades.com/conditions/smoking\"\u003esmoking\u003c/a\u003e, and high cholesterol. For some complex risks, such as having diabetes, a cardiologist will provide referrals to other specialists such as an\u0026nbsp;\u003ca href=\"https://www.healthgrades.com/explore/8-tips-for-choosing-an-endocrinologist\"\u003eendocrinologist\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003ePerforms procedures, such as EKG, echocardiogram, and cardiac catheterization\u003c/li\u003e\n\u003cli\u003eWorks closely with your primary care doctor and other specialists and members of your healthcare team to provide optimal care\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"font-weight: 400;\"\u003eCardiologists may also be known by the following names: cardiac doctor, cardiovascular disease doctor, heart specialist and\u0026nbsp;\u003ca href=\"https://www.healthgrades.com/explore/8-tips-for-choosing-a-cardiologist\"\u003eheart doctor\u003c/a\u003e.\u003c/p\u003e"])</script>

<script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I find a top-rated Cardiology Specialist in FL?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eHealthgrades gives you the tools and information you need to find high-quality care, including top-rated Cardiology Specialists in FL. You can filter your search results to a specific Rating threshold, or go to “Top Rated” to quickly view Cardiology Specialists with our highest patient ratings.\u003c/p\u003e\u003cp\u003eEvery Healthgrades profile includes information about the factors that matter most when choosing care, including a Cardiology Specialist's education, board certification, and experience. You can even see which specific conditions a doctor treats most often.\u003c/p\u003e\u003cp\u003eHealthgrades also spotlights high-quality healthcare professionals by identifying them as “Healthgrades Choice.” This badge indicates that a physician has above average experience, good patient ratings, no healthcare sanctions, and affiliations with quality hospitals.\u003c/p\u003e\u003cp\u003eFinally, you can read reviews and ratings from verified patients about their experiences with a doctor.\u003c/p\u003e\u003cp\u003eTogether, all of these factors provide a comprehensive picture of Cardiology Specialists in FL so you can make an informed, confident decision about the care you receive.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I share my experience after visiting a Cardiology Specialist through Healthgrades?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003ePatient ratings and reviews are an important tool in helping other people like yourself make informed healthcare choices. If you read patient reviews as part of your decision-making process, you can pay it forward by sharing your own experience with a Cardiology Specialist.\u003c/p\u003e\u003cp\u003eAfter your visit, you can visit your Cardiology Specialist's profile and go to “Leave a Review.” From here you will be required to provide a star rating from 1 to 5 to reflect how likely you are to recommend that doctor. You can also leave an optional text review about your experience.\u003c/p\u003e\u003cp\u003eYou will be required to submit your email address so Healthgrades can confirm your review, and you must verify that you received treatment from the physician and agree to Healthgrades terms and conditions.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I find a Cardiology Specialist in FL who speaks a specific language other than English?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eFinding a Cardiology Specialist in FL with whom you can communicate effectively is an essential part of finding quality care. You can go to “All Filters” on your Healthgrades search results and scroll to “Language.” From there, you narrow your search to physicians who speak your selected language(s).\u003c/p\u003e\u003cp\u003eHealthgrades lets you filter by more than 100 languages, including Spanish, Chinese, Arabic, Hindu, Urdu, Tagalog, and American Sign Language.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I find Cardiology Specialists within a specific distance from my location?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eGo to “Distance” on your Healthgrades search results page and select the distance range you would be willing to travel for your visit, such as 1 mile, 5 miles, 10 miles, 25 miles, 50 miles, 100 miles, or nationwide.\u003c/p\u003e\u003cp\u003eYou can also go to “Top Rated” to quickly view a list of 4-star and above-rated Cardiology Specialists within 10 miles of your selected location.\u003c/p\u003e\u003cp\u003eKeep in mind: The right specialist for you may not be among the ones closest to you, and it may be worth expanding your search to find the highest-quality care.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I search for Cardiology Specialists in FL specializing in a specific sub-specialty or niche area?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eAfter your initial specialty search, Healthgrades allows you to narrow your search to specific conditions or practicing areas within that specialty.\u003c/p\u003e\u003cp\u003eOn your Healthgrades search results page, go to “Practice Area.” From here you can select specific conditions or subspecialties that more directly reflect the type of care you need.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I find Cardiology Specialists in FL with availability that aligns with my schedule?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eYou can filter your Healthgrades search results based on appointment availability, including options such as same-day, tomorrow, or within 2 weeks. Under “All Filters,” scroll to “Availability” and select the appointment timeframe you need.\u003c/p\u003e\u003cp\u003eYou can also contact a Cardiology Specialist's office directly to ask about appointment availability, including same-day availability or unexpected cancellations that may have opened up new appointments in your desired timeframe.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I locate Cardiology Specialists in FL affiliated with a specific facility or hospital?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eFinding a Cardiology Specialist in FL with affiliations at high-quality hospitals is a key factor in a successful treatment outcome. Healthgrades lets you filter your search to doctors who have admitting privileges at the hospital(s) you prefer.\u003c/p\u003e\u003cp\u003eGo to “All Filters” on your Healthgrades search results, then scroll to “Affiliated Facility.” From here you can select one or more preferred hospitals to narrow your search to specialists with affiliations at those facilities.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I find Cardiology Specialists in FL who offer LGBTQ+ affirming care on Healthgrades?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eFinding a Cardiology Specialist in FL who affirms your identity is an essential part of a successful healthcare partnership. For people who identify as LGBTQ+, you can filter your Healthgrades search results to physicians who designate themselves as LGBTQ+ affirming.\u003c/p\u003e\u003cp\u003eGo to “All Filters” in your search results, then scroll down and select “LGBTQ+ affirming.”\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eIs it possible to filter Cardiology Specialists in FL based on their age on Healthgrades?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eSome people feel more comfortable seeing a Cardiology Specialist in a specific age range. You can filter your Healthgrades search results by going to “All Filters,” and then scrolling down to “Healthcare Professional’s Age.” From here, you can select age ranges from under 40, 41-50, 51-60, 61-70, or over 70 years old.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow can I use the 'Background Check' feature to verify if a Cardiology Specialist has any malpractice claims in FL?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eAll Healthgrades profiles include a medical license public record check, which tells you about any previous malpractice claims a Cardiology Specialist has on record in FL.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL stay updated on the latest advancements and treatments in cardiovascular medicine?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eCardiology Specialists have a variety of ways they stay current on the latest treatments and research within their specialty. These include subscribing to medical journals that publish peer-reviewed studies, attending in-person seminars or online webinars, or earning Continuing Medical Education (CME) credits to maintain their medical license.\u003c/p\u003e\u003cp\u003eDuring your appointment, ask your doctor or other healthcare professional about the ways they stay up-to-date about new treatments and how their learnings may affect your treatment options.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL collaborate with other healthcare providers to ensure comprehensive patient care?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eDepending on your diagnosis and treatment plan, you may have a team of healthcare professionals working together to provide quality care.\u003c/p\u003e\u003cp\u003eIn addition to your primary care physician and Cardiology Specialist, you may consult with other specialists, physical therapists, speech therapists, nutritionists, psychologists, physician's assistants, and nurses, among many others. Together, your care team can address all facets of your care and collaborate on the most effective treatment plan for you.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL personalize treatment plans to meet the unique needs of each patient?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eYour Cardiology Specialist in FL will determine your individual treatment plan based on factors including your medical history, family history, lifestyle, cultural considerations, and personal preferences. Through honest communication, you and your doctor can work together to build a treatment plan that is tailored to you.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL approach holistic care, considering factors beyond just medical treatment?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eIn additional to your medical care, you may wish for your treatment plan to include complementary therapies that serve your physical, emotional, and spiritual well-being. These may include wellness practices such as acupuncture, massage, or yoga. You may seek mental health support through counselors, psychologists, and support groups. You might also find comfort in spiritual support from faith leaders and communities. Talk with your specialist about the types of therapies that will provide holistic benefits, and ask about any precautions to take to avoid potential interactions with your medical treatment.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL prioritize patient safety and infection control measures in their practice?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003ePatient safety, including prevention of healthcare-associated infections, is a priority of all healthcare professionals. Both within physician practices and in hospital settings, team members take precautions to protect patients' health and safety during their care. This includes thorough handwashing, sterilization of equipment, and routine cleaning of rooms and facilities.\u003c/p\u003e\u003cp\u003eThe quality ratings of a physician's associated hospitals can also indicate a hospital's record for patient safety. A hospital with fewer healthcare-associated infections is likely to have better procedure outcomes, which will be reflected in higher quality ratings.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eWhat resources are available to support patients in navigating insurance coverage and financial assistance with Cardiology Specialists in FL?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eYour Cardiology Specialist's office can provide information about financial assistance, which may be referred to as charity care. Some doctor's offices also offer payment plans that allow you to pay your bill over a certain period of time.\u003c/p\u003e\u003cp\u003eIf you need to receive care at a hospital, you may qualify for financial assistance through that hospital. If you receive care at a nonprofilt hospital, you must be offered financial assistance if you cannot afford to pay. If you participate in a government program, such as Medicaid or Medicare, those programs' websites can offer guidance about coverage for the care you need.\u003c/p\u003e\u003cp\u003eYour hospital may also have a patient advocate on staff who can help guide you through your coverage or your financial assistance options. You can also find a your own guide through the Patient Advocate Foundation.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL contribute to ongoing medical research and advancements in their field?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eIn addition to offering clincal care, many Cardiology Specialists work outside of their practice in a variety of areas, including research, clinical trials, academic collaborations, or professional organizations. Through this work, Cardiology Specialists can share their own research, learn about treatment advances, and bring innovative new therapies to their practices.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eHow do Cardiology Specialists in FL accommodate patients with disabilities or special needs in their practice?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003eAll patients have a right to accessible and equitable care, including those with disabilities or special needs. Healthcare facilities must adhere to the Americans with Disabilities Act (ADA) and offer a range of accommodations to ensure accessibility. These may include structural features, such as ramps or wide entrances; language services, such as translators or sign language interpreters; accessible signage for people with impaired vision; or exam rooms and medical equipment that can be used by people with mobility aids.\u003c/p\u003e\"}},{\"@type\":\"Question\",\"name\":\"\u003cp\u003eWhat measures do Cardiology Specialists in FL take to ensure patient privacy and confidentiality in their practice?\u003c/p\u003e\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"\u003cp\u003ePatient data protection and privacy rights are a top priority for all healthcare practices. The Health Insurance Portability and Accountability Act (HIPAA) requires healthcare professionals to follow established safeguards to protect private health information and imposes penalties for those who violate privacy rights. HIPAA also allows patients to understand exactly how their health information is used and decide with whom it may be shared.\u003c/p\u003e\u003cp\u003eHealthcare systems also have rigorous digital security protocols to protect electronic health records, and any staff members with access to health information receive training on privacy practices to maintain patient trust and confidentiality.\u003c/p\u003e\"}}]}"])</script>

<script>self.__next_f.push([1,"\u003cp style=\"font-weight: 400;\"\u003eA cardiologist specializes in caring for people with conditions and diseases of the heart and blood vessels. Cardiologists diagnose and treat many diseases, including coronary heart disease, angina, arrhythmias, heart attack, and heart failure. These heart doctors are also experts in the prevention of heart disease.\u003c/p\u003e\n\u003cp style=\"font-weight: 400;\"\u003eA cardiologist typically:\u003c/p\u003e\n\u003cul style=\"font-weight: 400;\"\u003e\n\u003cli\u003eEvaluates a patient\u0026rsquo;s medical history and educates the patient about heart health and heart disease prevention\u003c/li\u003e\n\u003cli\u003ePerforms a physical exam including evaluating blood pressure, vital signs, weight, and the health of the heart, lungs, and blood vessels\u003c/li\u003e\n\u003cli\u003eOrders and interprets laboratory and imaging tests and prescribes medications\u003c/li\u003e\n\u003cli\u003eDiagnoses and treats acute and chronic diseases and conditions that affect the heart and blood vessels including coronary heart disease, angina, arrhythmias, heart attack, and heart failure\u003c/li\u003e\n\u003cli\u003eScreens, treats, and monitors conditions known to increase the risk of heart disease, such as hypertension,\u0026nbsp;\u003ca href=\"https://www.healthgrades.com/conditions/smoking\"\u003esmoking\u003c/a\u003e, and high cholesterol. For some complex risks, such as having diabetes, a cardiologist will provide referrals to other specialists such as an\u0026nbsp;\u003ca href=\"https://www.healthgrades.com/explore/8-tips-for-choosing-an-endocrinologist\"\u003eendocrinologist\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003ePerforms procedures, such as EKG, echocardiogram, and cardiac catheterization\u003c/li\u003e\n\u003cli\u003eWorks closely with your primary care doctor and other specialists and members of your healthcare team to provide optimal care\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"font-weight: 400;\"\u003eCardiologists may also be known by the following names: cardiac doctor, cardiovascular disease doctor, heart specialist and\u0026nbsp;\u003ca href=\"https://www.healthgrades.com/explore/8-tips-for-choosing-a-cardiologist\"\u003eheart doctor\u003c/a\u003e.\u003c/p\u003e"])</script>
