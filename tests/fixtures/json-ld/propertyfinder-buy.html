  site-ripper agents such as HTTrack and Screaming Frog, not us).

  This stands in for the plan's Zillow clause: Zillow, apartments.com, homes.com,
  zoopla, century21, remax, redfin, realtor.com and realestate.com.au all refuse
  an honestly-identified client (403/405/429), and schema.org publishes no
  example for RealEstateListing. propertyfinder.ae is a real, reachable portal
  publishing the same shape.

  for size. Every @type, `offers`, price and priceCurrency is untouched. The
  graph's Person / RealEstateAgent nodes were deliberately left out — no personal
